<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>current bls<span id="currbls"></span></p>
    <input type="number" placeholder="credit" id="crdt">
    <input type="submit" id="sub">
    <a href="./index.html">back</a>
    <script>
        var bls = localStorage.getItem("mydata")
        let databls = parseInt(bls)
        document.getElementById('currbls').innerHTML = localStorage.getItem("mydata")

        document.querySelector("#sub").addEventListener('click' , function(){
            
            let currbls = parseInt(document.getElementById('crdt').value);
            const crdRes = currbls + databls
            console.log(crdRes)

            localStorage.setItem('crdAmt' , crdRes)
        })

    </script>
</body>
</html>

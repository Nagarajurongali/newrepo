<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <input type="number" id="min">
        <input type="number" id="max">
        <input type="submit" id="filter">
    </form>
    <div class="main">
        <p data-value="500">500</p>
        <p data-value="2000">2000</p>
        <p data-value="1600">1600</p>
        <p data-value="900">900</p>
        <p data-value="700">700</p>
    </div>
    <script>
        let dataValue = document.querySelectorAll("p").forEach(function(item){
            document.getElementById("filter").addEventListener('click' , function(){

                let min = parseInt(document.getElementById('min').value);
                let max = parseInt(document.getElementById('max').value);

                let dataitems = item.getAttribute('data-value');
                console.log(dataitems);

                if(dataitems >= min && dataitems <= max){
                    item.style.display = "block"
                }
                else{
                    item.style.display = "none"

                }


            })
        })
    </script>
</body>
</html>

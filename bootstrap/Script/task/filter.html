<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
    <style>
        .child{
            height: 300px;
            width: 250px;
        }
        .child img{
            width: 100%;
        }
    </style>
</head>
<body>
    <form action="">
        <input type="number" id="min" placeholder="Enter Min Value">
        <input type="number" id="max" placeholder="Enter max Value">
        <input type="button" value="filter" id="filter" >
    </form>
    <div class="main d-flex" style="flex-wrap: wrap;">
        <div class="child bg-warning" class="box" data-value="500">
            <img src="./imgges/pngwing.com (4).png"  alt="">
            <p >500</p>
        </div>
        <p class="box" data-value="300">300</p>
        <p class="box" data-value="800">800</p>
        <p class="box" data-value="1000">1000</p>
        <p class="box" data-value="1200">1200</p>
        <p class="box" data-value="1500">1500</p>
        <p class="box" data-value="1800">1800</p>
        <p class="box" data-value="1800">1800</p>
        <p class="box" data-value="600">600</p>
    </div>

    <script>
        let mydata = document.getElementById('filter');
        let dataValue = document.querySelectorAll('.box');
        dataValue.forEach(function(item){
            mydata.addEventListener('click' , function(){

                let minVal = document.getElementById('min').value;
                let maxVal = document.getElementById('max').value;

                let minInt = parseInt(minVal);
                let maxInt = parseInt(maxVal);

                let dataItems = item.getAttribute('data-value');

                if(dataItems >= minInt && dataItems <= maxInt ){
                    item.style.display="block"
                }
                else{
                    item.style.display="none"
                }

            })
        })

        
    </script>

</body>
</html>
